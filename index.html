<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <!-- custom css -->
    <link rel="stylesheet" href="style.css">
    <title>Budget Buddy</title>
</head>

<body>
    <header>
        <nav class="navbar mt-2 me-5 ms-5">
            <div class="container-fluid">
                <img class="logo-img" src="/assets/logo.png" alt="logo image">
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search Transaction..."
                        aria-label="Search" />
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </nav>
    </header>

    <main>
        <section class="info-cards-section mt-3 me-5">
            <div class="d-flex justify-content-end gap-4">
                <div class="info-card bg-success card p-3 shadow-sm">
                    <h6 class="fw-light">Current Balance</h6>
                    <span>
                        <p class="balance">$3,450.00</p>
                    </span>
                </div>
                <div class="info-card bg-primary card p-3 shadow-sm">
                    <h6 class="fw-light">Total Income</h6>
                    <span>
                        <p class="income">+ $2,200.00</p>
                    </span>
                </div>
                <div class="info-card bg-danger card p-3 shadow-sm">
                    <h6 class="fw-light">Total Expenses</h6>
                    <span>
                        <p class="expense">- $750.00</p>
                    </span>
                </div>
            </div>
        </section>

        <section class="add-transaction-section ms-5">
            <div class="card add-card ps-3 pe-3 pt-4 pb-4 shadow-sm">
                <h3 class="pb-3">Add Transaction</h3>
                <div class="input-group input-group-sm mb-3 d-flex flex-column">
                    <h6>Description</h6>
                    <input type="text" class="form-control w-auto" aria-label="Sizing example input"
                        aria-describedby="inputGroup-sizing-sm">
                </div>
                <div class="input-group input-group-sm mb-3 d-flex flex-column">
                    <h6>Amount</h6>
                    <input type="text" class="form-control w-auto" aria-label="Sizing example input"
                        aria-describedby="inputGroup-sizing-sm">
                </div>
                <div class="btn-group" role="group" aria-label="Basic radio toggle button group">
                    <h6>Type</h6>

                    <input type="radio" class="btn-check" name="btnradio" id="btnradio1" autocomplete="off" checked>
                    <label class="btn btn-outline-primary" for="btnradio1">Income</label>

                    <input type="radio" class="btn-check" name="btnradio" id="btnradio2" autocomplete="off">
                    <label class="btn btn-outline-primary" for="btnradio2">Expense</label>

                </div>
                <div>
                    <h6>Date</h6>
                    <input class="date-selector" type="date" value="" />
                </div>
                <div class="d-flex justify-content-center">
                    <button type="button" class="btn btn-primary add-btn mt-4 mb-4">Add Transaction</button>
                </div>
                <div class="d-flex justify-content-center">
                    <img class="logomark" src="assets/logomark.png" alt="logo">
                </div>
            </div>
        </section>

        <section class="dashboard-section">
            <div class="card card-dashboard">
                <div>
                    <h3>Transaction Feed</h3>
                    <h5 class="fw-light">Cash Flow - January 2026 - July 2026</h5>
                </div>
                <div class="d-grid gap-2 d-md-block">
                    <button class="btn btn-primary active" type="button">All</button>
                    <button class="btn btn-primary" type="button">Income</button>
                    <button class="btn btn-primary" type="button">Expense</button>
                </div>
            </div>
        </section>
    </main>

<script src="script.js"></script>
</body>

</html>
